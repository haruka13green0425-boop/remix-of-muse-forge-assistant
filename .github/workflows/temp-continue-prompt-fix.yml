name: temporary-continue-prompt-fix
on:
  push:
    paths:
      - .github/workflows/temp-continue-prompt-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continuePrompt generation rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/gate.functions.ts')
          s = p.read_text()
          start = s.index('    const prompt =\n      lang === "ja"\n        ? `以下は既存のプロンプトです。テーマ「${theme}」、題材「${usageTitle}: ${usageDesc}」向け。\nこのプロンプトの **続き（追記部分）を必ず3案** 生成してください:')
          end_marker = '\n\n    const raw = await callAI(prompt, system);'
          end = s.index(end_marker, start)
          replacement = r'''    const correctionLenses = [
      "認知降伏（難しい問いで考えることを諦め、もっともらしい答えに早く収束していないか）",
      "フィルターバブル（特定の情報・視点だけが強化され、重要な異論や別視点が欠落していないか）",
      "迎合（ユーザーの前提や期待に合わせすぎ、必要な批判・留保を失っていないか）",
      "確証バイアス（既存の信念を支持する情報だけを集め、反証を見落としていないか）",
      "アンカリング（最初に与えられた情報や数値に判断が不必要に固定されていないか）",
      "前提の固定化（既存プロンプトの前提を疑わず、そのまま強化していないか）",
      "過度な一般化（限定された事例から広すぎる結論を導いていないか）",
    ];
    const correctionLens = correctionLenses[Math.floor(Math.random() * correctionLenses.length)];

    const prompt =
      lang === "ja"
        ? `以下は既存のプロンプトです。テーマ「${theme}」、題材「${usageTitle}: ${usageDesc}」向け。
このプロンプトの **続き（追記部分）を必ず3案** 生成してください。

重要な生成ルール:
- 3案のうち **最低1案は、既存プロンプトそのものの弱点を発見して訂正・補正する方向の追記** にすること。今回の訂正観点は「${correctionLens}」を使うこと。ただし、元プロンプトにこの問題が実際に関係する場合に限って適用し、無理に当てはめないこと。残りの案でも必要なら別の関連する訂正観点を使ってよい。
- 訂正案は元プロンプトの目的・対象・立場・前提と矛盾させず、「元の目的をより正確・堅牢に達成するための補正」とすること。
- 訂正観点は毎回同じものに固定せず、今回指定された観点を使いつつ、次回以降は別の関連する観点を選べるようにすること。
- 残りの案は、元プロンプトから自然に発展する通常の「続き」。既存内容の単なる言い換えや繰り返しは禁止。
- 3案は互いに異なる切り口・発展方向にすること。
- **「学術理論1＋思考法1＋プロンプトエンジニアリング技法1」という固定セットは禁止。** 各案には「学術理論」「思考法」「プロンプトエンジニアリング技法」をそれぞれ最低1つ含めるが、2つ以上含めてもよい（例: 学術理論2＋思考法1＋技法2）。案ごとに組み合わせ・個数を変えてよい。
- 学術理論・思考法・プロンプトエンジニアリング技法は、元プロンプトの内容に自然に合う実在のものだけを採用する。テーマに合わないものを数合わせで入れない。
- ${techniqueCorrectnessRule("ja")}
- 追記本文はプレーンテキストのみ。元プロンプトの内容と矛盾する立場を勝手に追加しない。

${instruction ? `追加の方向性: ${instruction}\n` : ""}
既存プロンプト:
${currentPrompt}

出力は純粋なJSONのみ:
{
  "items": [
    {
      "continuation": "追記本文（Markdown禁止・プレーンテキスト・日本語・300〜700字程度）",
      "components": [
        { "name": "学術理論の具体名", "category": "学術理論", "reason": "40〜80字" },
        { "name": "思考法の具体名", "category": "思考法", "reason": "40〜80字" },
        { "name": "プロンプト技法の具体名", "category": "プロンプトエンジニアリング", "reason": "40〜80字" }
      ]
    }
  ]
}
"items" は必ず3件。各itemsのcomponentsは3〜7件程度とし、3カテゴリそれぞれ最低1件。3カテゴリの個数は固定せず、内容に応じて変えること。`
        : `The following is an existing prompt for theme "${theme}" and usage "${usageTitle}: ${usageDesc}".
Generate exactly 3 **continuation additions** to this prompt.

Critical generation rules:
- At least **one of the 3 items must correct or strengthen a weakness in the existing prompt**. Use this correction lens for this generation: "${correctionLens}". Apply it only if genuinely relevant to the existing prompt; do not force a mismatch. Other relevant correction lenses may also be used.
- A correction item must preserve the existing prompt's purpose, audience, stance, and assumptions; it should make the original goal more accurate or robust, not contradict it.
- Do not permanently reuse the same correction lens; vary the relevant lens across generations.
- The other items should be natural continuations of the existing prompt, not rewrites or repetitions.
- Make all 3 items meaningfully different in angle and development.
- **Do NOT use a fixed "1 academic theory + 1 thinking method + 1 prompt-engineering technique" set.** Every item must contain at least one of each category, but may contain two or more from any category (e.g. 2 theories + 1 thinking method + 2 techniques). Vary the count and combination by item.
- Select only real, established theories, thinking methods, and prompt-engineering techniques that naturally fit the existing prompt. Never add irrelevant items just to satisfy a quota.
- ${techniqueCorrectnessRule("en")}
- Continuations must be plain text and must not introduce a stance that contradicts the existing prompt.

${instruction ? `Additional direction: ${instruction}\n` : ""}
Existing prompt:
${currentPrompt}

Return ONLY pure JSON:
{
  "items": [
    {
      "continuation": "plain-text continuation",
      "components": [
        { "name": "specific academic theory", "category": "Academic Theory", "reason": "40-80 chars" },
        { "name": "specific thinking method", "category": "Thinking Method", "reason": "40-80 chars" },
        { "name": "specific prompt technique", "category": "Prompt Engineering", "reason": "40-80 chars" }
      ]
    }
  ]
}
"items" must contain exactly 3 entries. Each components array should contain about 3-7 entries, with at least one item from each of the three categories. Do not fix the category counts; vary them according to the content.`;
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git diff -- src/lib/gate.functions.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/gate.functions.ts
          git commit -m "fix: diversify continue-prompt generation"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/temp-continue-prompt-fix.yml
          git commit -m "chore: remove temporary prompt-fix workflow"
          git push
