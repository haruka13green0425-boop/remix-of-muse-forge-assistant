name: Update continue prompt generation rules

on:
  push:
    paths:
      - .github/workflows/update-continue-prompt.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace continuePrompt implementation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/gate.functions.ts")
          text = path.read_text(encoding="utf-8")
          marker = "// --- Continue prompt ---"
          if marker not in text:
              raise SystemExit("Continue prompt marker not found")

          replacement = r'''// --- Continue prompt ---

export const continuePrompt = createServerFn({ method: "POST" })
  .inputValidator((d: unknown) => RefineInput.parse(d))
  .handler(async ({ data }) => {
    const { lang, theme, usageTitle, usageDesc, currentPrompt, instruction } = data;
    const system =
      lang === "ja"
        ? `あなたはプロンプト設計の名匠です。${langLine("ja")} 各案の "continuation" 本文は **Markdown一切禁止のプレーンな日本語テキスト** のみ。${proseOnlyRule("ja")}`
        : `You are a master prompt designer. ${langLine("en")} Each "continuation" body must be **plain English text with no Markdown at all**. ${proseOnlyRule("en")}`;

    const prompt =
      lang === "ja"
        ? `以下は既存のプロンプトです。テーマ「${theme}」、題材「${usageTitle}: ${usageDesc}」向けです。

このプロンプトの「つづき（追記部分）」を必ず3案生成してください。

【3案の役割】
- 3案のうち最低1案は、既存プロンプトそのものの弱点・盲点・偏り・危険な前提を発見し、それを訂正・補正・強化する方向の追記にすること。
- 訂正・補正案では、認知降伏、フィルターバブル、迎合、確証バイアス、アンカリング、前提の固定化、過度な一般化、その他の認知的・論理的・方法論的な弱点の検出と修正などから、**今回のテーマと既存プロンプトに本当に関係するものを選ぶ**こと。
- 訂正・補正に使う観点は毎回同じものに固定せず、候補の中からランダム性を持たせて変更する。ただし、テーマや既存プロンプトに無関係な概念を無理に入れないこと。
- 残りの案は、既存プロンプトの目的・立場・前提を維持しながら、自然に発展・深化させる通常の「つづき」とすること。
- 通常案も単なる言い換えや前回と同じ型の繰り返しにせず、問いの性質に応じて、分析の深化、具体化、応用、比較、評価基準の追加、反例検討、実践化、視点拡張など異なる方向を選ぶこと。
- **既存プロンプトの目的・立場・前提と矛盾する方向へ勝手に変更してはならない。** 例えば学習計画を改善するプロンプトに対して、学習計画そのものを否定する追記を入れないこと。

【要素の組み合わせ】
- これまでのように「学術理論1つ＋思考法1つ＋プロンプトエンジニアリング技法1つ」を毎回固定で割り当てることは禁止。
- 各案では、学術理論・思考法・プロンプトエンジニアリング技法を、**必要なものだけ自由に組み合わせてよい**。
- ただし、components に含める場合は、学術理論・思考法・プロンプトエンジニアリング技法の各カテゴリについて**最低1つ以上**を含めること。1案のcomponentsは合計3個に限定せず、例えば学術理論2＋思考法1＋プロンプト技法2のようにしてよい。
- 3案すべてを同じ組み合わせにせず、テーマに最適な構成をそれぞれ選ぶこと。
- 学術理論・思考法は実在するもののみ。造語禁止。
- プロンプトエンジニアリング技法は実在し、名称と使い方を正確に説明できるもののみ。${techniqueCorrectnessRule("ja")}
- 各案のcomponentsに挙げた要素は、continuation本文の中で実際に機能する形で組み込むこと。単に名称を飾りとして列挙しない。
- 3案の間で、同じ理論・思考法・プロンプト技法を必要以上に重複させないこと。重複よりもテーマとの整合性を優先する。
- 3案それぞれが互いに十分異なる知的方向になるようにすること。

【訂正案の品質条件】
- 「訂正するための訂正」を作らない。まず既存プロンプトを読み、その内容から実際に起こりうる弱点を特定してから補正すること。
- 元プロンプトに存在しない問題を捏造しない。
- 訂正案は、既存プロンプトの価値を壊すのではなく、精度・公平性・妥当性・実用性・検証可能性などを必要に応じて高める方向にすること。
- 訂正系の観点名を本文に入れる場合も、テーマに自然に適合するように使うこと。

${instruction ? `追加の方向性: ${instruction}\n\n` : ""}既存プロンプト:
"""
${currentPrompt}
"""

出力は純粋なJSONのみ:
{
  "items": [
    {
      "continuation": "追記本文（Markdown禁止・プレーンテキスト・日本語・300〜700字程度）",
      "components": [
        { "name": "具体的な学術理論", "category": "学術理論", "reason": "40〜80字" },
        { "name": "具体的な思考法", "category": "思考法", "reason": "40〜80字" },
        { "name": "具体的なプロンプト技法", "category": "プロンプトエンジニアリング", "reason": "40〜80字" }
      ]
    },
    { "continuation": "...", "components": [ ...必要な要素を自由な個数で... ] },
    { "continuation": "...", "components": [ ...必要な要素を自由な個数で... ] }
  ]
}

componentsには各案で採用した要素をすべて記載し、各カテゴリを最低1つずつ含めること。`
        : `Below is an existing prompt for theme "${theme}", task "${usageTitle}: ${usageDesc}".

Generate exactly 3 continuation variants: text that can be appended to the existing prompt.

[Three variant roles]
- At least one of the 3 variants MUST identify and correct, compensate for, or strengthen an actual weakness, blind spot, bias, or unsafe assumption in the existing prompt.
- For the correction variant, choose a concept genuinely relevant to the theme and prompt from cognitive surrender, filter bubbles, sycophancy, confirmation bias, anchoring, fixed assumptions, overgeneralization, or another valid cognitive/logical/methodological weakness-detection approach.
- Do not use the same correction concept every time. Vary the correction angle with randomness, while never forcing an irrelevant concept into the prompt.
- The other variants should be normal continuations that naturally develop the existing prompt while preserving its purpose, stance, and assumptions.
- Normal variants must not become repetitive paraphrases. Depending on the task, vary among deeper analysis, concretization, application, comparison, evaluation criteria, counterexample testing, practicalization, perspective expansion, and other genuinely useful directions.
- **Never contradict or arbitrarily reverse the purpose, stance, or assumptions of the existing prompt.** For example, if the prompt is designed to improve a study plan, do not add a continuation that rejects study planning itself.

[Component combinations]
- Do NOT force the old fixed pattern of exactly one Academic Theory + one Thinking Framework + one Prompt Engineering Technique in every variant.
- Each variant may freely combine only the elements it actually needs.
- If components are used, each variant MUST contain at least one Academic Theory, at least one Thinking Framework, and at least one Prompt Engineering Technique. There is no 3-component limit: for example, Academic Theory x2 + Thinking Framework x1 + Prompt Engineering Technique x2 is valid.
- Do not make all 3 variants use the same combination. Select the structure that best fits each variant and the task.
- Academic theories and thinking frameworks must be real. No coinages.
- Prompt-engineering techniques must be real and accurately described. ${techniqueCorrectnessRule("en")}
- Every component listed must be operationalized inside the continuation, not merely named.
- Avoid unnecessary reuse of the same theory, framework, or technique across variants; however, thematic fit takes priority over artificial non-overlap.
- Make the three variants genuinely different in intellectual direction.

[Correction-variant quality]
- Do not manufacture a correction merely for the sake of having one. Read the existing prompt first and identify a weakness that can actually arise from its content.
- Do not invent a problem that is not present or reasonably implied by the existing prompt.
- A correction should improve accuracy, fairness, validity, practicality, verifiability, or another relevant quality rather than destroy the prompt's original value.
- If the correction concept is named in the continuation, use it naturally and specifically for this task.

${instruction ? `Extra direction: ${instruction}\n\n` : ""}Existing prompt:
"""
${currentPrompt}
"""

Return ONLY pure JSON:
{
  "items": [
    {
      "continuation": "The continuation body (no Markdown, plain English, ~400-900 chars)",
      "components": [
        { "name": "specific academic theory", "category": "Academic Theory", "reason": "~60-120 chars" },
        { "name": "specific thinking framework", "category": "Thinking Framework", "reason": "~60-120 chars" },
        { "name": "specific prompt technique", "category": "Prompt Engineering", "reason": "~60-120 chars" }
      ]
    },
    { "continuation": "...", "components": [ ...any number of useful components... ] },
    { "continuation": "...", "components": [ ...any number of useful components... ] }
  ]
}

List every component actually used in each variant. Each variant must contain at least one item from each of the three categories.`;

    const raw = await callAI(prompt, system);
    const out = extractJson<{
      items: Array<{
        continuation: string;
        components: Array<{ name: string; category: string; reason: string }>;
      }>;
    }>(raw);
    return {
      ...out,
      items: (out.items ?? []).map((item) => ({
        ...item,
        continuation: sanitizeProse(item.continuation),
      })),
    };
  });
'''

          path.write_text(text.split(marker, 1)[0] + replacement + "\n", encoding="utf-8")
          print("Updated continuePrompt section")

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/gate.functions.ts
          git rm .github/workflows/update-continue-prompt.yml
          git commit -m "feat: diversify continue prompt generation"
          git push
